# Local run of the full stack, mirroring the target AWS topology:
#   sii-mcp, sii-agent, ecommerce-agent -> AgentCore Runtime
#   api                                 -> Fargate/App Runner (SQLite inside)
#   web                                 -> Amplify Hosting
#
# AWS credentials: uses your host SSO session (~/.aws mounted read-only).
# Run `aws sso login` first. Copy .env.example to .env for the rest.

x-aws-env: &aws-env
  AWS_PROFILE: ${AWS_PROFILE:-}
  AWS_REGION: ${AWS_REGION:-us-east-1}

x-langfuse-env: &langfuse-env
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  # From inside a container, "localhost" is the container itself; use
  # host.docker.internal to reach a Langfuse running on your host.
  LANGFUSE_BASE_URL: ${LANGFUSE_DOCKER_BASE_URL:-http://host.docker.internal:3000}

services:
  sii-mcp:
    build:
      context: .
      dockerfile: sii-mcp/Dockerfile
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  sii-agent:
    build:
      context: .
      dockerfile: sii-agent/Dockerfile
    environment:
      <<: [*aws-env, *langfuse-env]
      SII_MCP_URL: http://sii-mcp:8001/mcp
      SII_AGENT_PORT: 8002
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
    volumes:
      - ~/.aws:/root/.aws:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sii-mcp:
        condition: service_healthy

  ecommerce-agent:
    build:
      context: .
      dockerfile: ecommerce-agent/Dockerfile
    environment:
      <<: [*aws-env, *langfuse-env]
      ECOMMERCE_API_URL: http://api:8000
      ECOMMERCE_API_USERNAME: ${API_USERNAME:-admin}
      ECOMMERCE_API_PASSWORD: ${API_PASSWORD:-admin123}
      SII_AGENT_URL: http://sii-agent:8002
      ECOMMERCE_AGENT_PORT: 8080
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
      BEDROCK_KB_ID: ${BEDROCK_KB_ID:-}
      BEDROCK_KB_DATA_SOURCE_ID: ${BEDROCK_KB_DATA_SOURCE_ID:-}
      BEDROCK_KB_S3_BUCKET: ${BEDROCK_KB_S3_BUCKET:-}
    volumes:
      - ~/.aws:/root/.aws:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - sii-agent

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      SII_MCP_BASE_URL: http://sii-mcp:8001
      ECOMMERCE_AGENT_URL: http://ecommerce-agent:8080
      API_USERNAME: ${API_USERNAME:-admin}
      API_PASSWORD: ${API_PASSWORD:-admin123}
    depends_on:
      sii-mcp:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me}
    depends_on:
      - api
