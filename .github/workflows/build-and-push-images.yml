name: "Build and Push Images"
# run-name: Build and Push Images (run name)

on:
  push:
    # Only the components that end up inside an image, plus `common/`, which
    # both agents depend on. Changes to infra/ or web/ don't need a rebuild.
    paths:
      - 'api/**'
      - 'ecommerce-agent/**'
      - 'sii-agent/**'
      - 'sii-mcp/**'
      - 'common/**'
      - '.github/workflows/build-and-push-images.yml'

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::203385884471:role/oidc-github-agentic-ecommerce-demo

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  GetImages:
    runs-on: ubuntu-24.04-arm
    outputs:
      images: ${{ steps.get-images.outputs.images }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Tofu Init
        run: |
          devenv shell tofu -chdir=infra/envs/dev init -input=false
      - name: Get Images to Build
        id: get-images
        run: |
          # Emit [{name, uri}, ...]. The map key is the component name, which
          # is also the directory holding its Dockerfile — so the build reads
          # the name from the key instead of parsing it out of the URI.
          images=$(devenv shell tofu -chdir=infra/envs/dev output -json \
            | jq -rc '.ecr_repository_uris.value
                      | to_entries
                      | map({name: .key, uri: .value})')
          echo "images=$images" >> "$GITHUB_OUTPUT"

  Build:
    runs-on: ubuntu-24.04-arm
    needs: GetImages
    name: Build (${{ matrix.image.name }})
    strategy:
      # One broken component shouldn't cancel the other three.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.GetImages.outputs.images) }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/arm64,linux/amd64
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          # Repo root as context: the agents COPY common/ during the build.
          context: .
          file: ${{ matrix.image.name }}/Dockerfile
          push: true
          # The SHA tag is the real identity (traceable, rollback-able);
          # `latest` is just a moving pointer for convenience. Deployments
          # should pin the SHA, never `latest`.
          tags: |
            ${{ matrix.image.uri }}:${{ github.sha }}
            ${{ matrix.image.uri }}:latest
          # Layer cache, scoped per component so the four jobs don't evict
          # each other. Note GitHub caps the cache at 10GB per repo with LRU
          # eviction; if these images outgrow it, switch mode=max to mode=min
          # or move the cache to ECR (type=registry).
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  UpdateContainers:
    needs: Build
    uses: $/.github/workflows/infra-deployment.yml
