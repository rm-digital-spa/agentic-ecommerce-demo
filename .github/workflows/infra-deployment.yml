name: "Infra Deployment"
# run-name: Infra Deployment (run name)

on:
  push:
    paths:
      - 'infra/**'
      - '.github/workflows/infra-deployment.yml'
      # tofu comes from the devenv shell, so its version is a dependency too
      - 'devenv.nix'
      - 'devenv.lock'

env:
  AWS_REGION: us-east-1
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout
jobs:
  Plan:
    runs-on: ubuntu-latest
    # Superseded plans of the same branch are wasted work: cancel them.
    # The env name is hardcoded because the `env` context is NOT available
    # inside `concurrency` — it would silently resolve to an empty group.
    concurrency:
      group: tofu-development-plan-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::203385884471:role/oidc-github-agentic-ecommerce-demo
          aws-region: ${{ env.AWS_REGION }}
      - name: Tofu Init
        run: |
          devenv shell tofu -chdir=infra/envs/dev init -input=false
      - name: Tofu Plan
        run: |
              devenv shell tofu -chdir=infra/envs/dev plan -input=false -out=plan.out
      - name: Upload Tofu Plan
        uses: actions/upload-artifact@v4
        with:
          name: tofu-plan
          path: infra/envs/dev/plan.out
          retention-days: 5
  Apply:
    runs-on: ubuntu-latest
    needs: Plan
    environment: development
    # The shared resource is the state file, not the branch, so this group is
    # keyed to the environment only: applies from any branch queue up behind
    # each other. Never cancel a running apply — that can orphan the state
    # lock and leave the state out of sync with reality.
    concurrency:
      group: tofu-development-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::203385884471:role/oidc-github-agentic-ecommerce-demo
          aws-region: ${{ env.AWS_REGION }}
      - name: Tofu Init
        run: |
          devenv shell tofu -chdir=infra/envs/dev init -input=false
      - name: Download Tofu Plan
        uses: actions/download-artifact@v4
        with:
          name: tofu-plan
          path: infra/envs/dev
      - name: Tofu Apply
        run: |
          devenv shell tofu -chdir=infra/envs/dev apply -input=false plan.out
