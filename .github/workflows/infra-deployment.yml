name: "Infra Deployment"
# run-name: Infra Deployment (run name)

on:
  push:
    paths:
      - 'infra/**'
env:
  AWS_REGION: us-east-1
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout
jobs:
  Plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::203385884471:role/oidc-github-agentic-ecommerce-demo
          aws-region: ${{ env.AWS_REGION }}
      - name: Tofu Init
        run: |
          devenv shell tofu -chdir=infra/envs/dev init -input=false
      - name: Tofu Plan
        run: |
              devenv shell tofu -chdir=infra/envs/dev -out=plan.txt plan -input=false
      - name: Upload Tofu Plan
        uses: actions/upload-artifact@v4
        with:
          name: tofu-plan
          path: plan.txt
  Apply:
    runs-on: ubuntu-latest
    needs: Plan
    environment: development
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::203385884471:role/oidc-github-agentic-ecommerce-demo
          aws-region: ${{ env.AWS_REGION }}
      - name: Tofu Init
        run: |
          devenv shell tofu -chdir=infra/envs/dev init -input=false
      - name: Tofu Apply
        run: |
          # devenv shell tofu -chdir=infra/envs/dev apply -input=false -auto-approve plan.txt
          echo "Tofu Apply step is commented out for safety. Uncomment the line above to enable deployment."
